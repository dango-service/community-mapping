name: Validate Dataset Integrity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Build distributions
        run: go run ./cmd/mapping build

      - name: Run dataset validation
        run: go run ./cmd/mapping validate
