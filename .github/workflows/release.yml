name: Publish Release Distributions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Build distributions
        run: go run ./cmd/mapping build

      - name: Validate dataset integrity
        run: go run ./cmd/mapping validate

      - name: Package distributions archive
        run: |
          mkdir -p dist
          tar -czf dist/distributions-bundle.tar.gz -C generated .
          (cd generated && zip -r ../dist/distributions-bundle.zip .)

      - name: Determine tag name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist
          sed "s/\${TAG}/$TAG/g" .github/release_template.md > dist/release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body_path: dist/release_notes.md
          files: |
            dist/distributions-bundle.tar.gz
            dist/distributions-bundle.zip
            generated/*.db
            generated/*.sql
            generated/*.json
            generated/unmapped.yaml

